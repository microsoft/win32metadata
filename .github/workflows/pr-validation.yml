# PR Validation — Full cross-architecture build and test
#
# Mirrors the Azure Pipelines CI pipeline (azure-pipelines.yml) but runs as a
# GitHub Actions workflow so PR checks work without Azure DevOps integration.
#
# Pipeline structure:
#   1. Detect whether the PR changes files outside docs/ and apidocs/
#   2. Run selected managed regressions independently of SDK generation
#   3. Three parallel scrape jobs (x64, x86, arm64) generate metadata source
#   4. One build job assembles the winmd, packages, samples, and runs all tests
#      or reports success immediately for documentation-only PRs

name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'apidocs/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release

jobs:
  workflow-tests:
    name: Workflow regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test API diff comment workflow
        run: node --test .github/tests/pr-api-diff-comment.test.cjs

  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.filter.outputs.build_needed }}

    steps:
      - name: Check changed paths
        id: filter
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('build_needed', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const ignoredPrefixes = ['docs/', 'apidocs/'];
            const changedPaths = files.flatMap(file =>
              file.status === 'renamed' && file.previous_filename
                ? [file.previous_filename, file.filename]
                : [file.filename]);
            const buildFiles = [...new Set(changedPaths)]
              .filter(file => !ignoredPrefixes.some(prefix => file.startsWith(prefix)));
            const fileListIncomplete = files.length < context.payload.pull_request.changed_files;
            const buildNeeded = fileListIncomplete || buildFiles.length !== 0;

            core.setOutput('build_needed', buildNeeded.toString());
            await core.summary
              .addHeading(buildNeeded ? 'Full validation required' : 'Documentation-only change')
              .addRaw(fileListIncomplete
                ? 'The complete changed-file list was not available. Running full validation.'
                : buildNeeded
                  ? `Files outside docs/ or apidocs/ changed:\n${buildFiles.map(file => `- ${file}`).join('\n')}`
                  : 'All changed files are under docs/ or apidocs/. The expensive build is skipped.')
              .write();

  managed-regressions:
    name: Fast managed regressions
    needs: [changes]
    if: needs.changes.outputs.build_needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Run selected managed regression tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $emitterSelection = [ordered]@{
            'FullyQualifiedName~ConfiguredNativeFamiliesShareOnlyTheRetainedPublicProjection' = 4
            'FullyQualifiedName~ConfiguredRetainedProjectionDoesNotBypassNativeFamilyValidation' = 6
            'FullyQualifiedName~TypedefFragmentsRetainOnlyTheirProducingCompilationsSemanticModels' = 1
            'FullyQualifiedName~RecordBindingModelsDoNotCrossCompilationVersions' = 1
            'FullyQualifiedName~LargeNativeRecordFamiliesKeepEveryCanonicalBinding' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.NamesToCorrectNamespacesMoverTests' = 7
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.NamespaceQualificationTests' = 12
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.LogicalGroupOwnershipMovesConsumersAndRemovesOnlyItsOriginalConstantCopies' = 4
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.LogicalGroupOwnershipRejectsAmbiguousOrMissingTraversalOwners' = 2
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.IndependentLogicalContributionsKeepTheirMembersWithoutClaimingOneNativeDeclaration' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.SameManagedGroupNameDoesNotAuthorizeDifferentNativeNames' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.IncompleteDeclarationsUseNativeIdentityAndKeepPointerConsumers' = 4
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.AnUnprovenEmptyRecordCannotComposeWithAProvenNativeDeclaration' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.UnprovenEmptyRecordsRemainUnresolvedInsteadOfBeingCollapsedBySpelling' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.LegacyEmptyPlaceholdersRequireTheirOwnQualifiedDefinition' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.SameSpelledIncompleteRecordsDoNotAcquireACommonOwner' = 2
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.CommonNativeObservationRequiresAllDirectArchitectureProviders' = 6
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.SingleCommonOriginalSdkDeclarationsPreserveNativeContracts' = 1
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.SingleCommonDeclarationsRequireTheirActualProducingTarget' = 3
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.SingleCommonForwardsRequireCompleteProviderCoverage' = 6
            'FullyQualifiedName~ClangSharpSourceToWinmdTests.HeaderTypedefCompositionTests.SingleCommonForwardDoesNotAcceptManagedSpellingAsDefinition' = 1
          }
          $provenanceSelection = [ordered]@{
            'FullyQualifiedName~MetadataUtils.Tests.NativeDeclarationSourceProvenanceTests.RoundTripsOnlyDeclarationIdentity' = 4
            'FullyQualifiedName~MetadataUtils.Tests.NativeDeclarationSourceProvenanceTests.CacheRemainsBoundToTheExactImmutableNode' = 2
            'FullyQualifiedName~MetadataUtils.Tests.NativeDeclarationSourceProvenanceTests.RejectsMalformedOrLayoutBearingTransport' = 6
            'FullyQualifiedName~MetadataUtils.Tests.NativeDeclarationSourceProvenanceTests.DoesNotReplaceCompleteLayoutOrUnrelatedDeclarationIdentity' = 1
          }
          $expectedHGroupRows = @(
            foreach ($target in @('x86', 'x64', 'arm64', 'crossarch')) {
              "ConfiguredNativeFamiliesShareOnlyTheRetainedPublicProjection ($target)"
            }
            foreach ($reason in @('header-hash', 'coordinates', 'missing-source', 'binding-drift',
                'ambiguous-retained', 'unconfigured-family')) {
              "ConfiguredRetainedProjectionDoesNotBypassNativeFamilyValidation ($reason)"
            }
          )
          $projects = @(
            @{
              Label = 'Emitter'
              Project = '.\tests\ClangSharpSourceToWinmdTests'
              Selection = $emitterSelection
              LogName = 'FastManaged.trx'
              RequiredRows = $expectedHGroupRows
            }
            @{
              Label = 'Provenance'
              Project = '.\tests\MetadataUtils.Tests'
              Selection = $provenanceSelection
              LogName = 'FastProvenance.trx'
              RequiredRows = @()
            }
          )
          foreach ($project in $projects) {
            $filter = $project.Selection.Keys -join '|'
            $started = Get-Date
            dotnet test $project.Project -c Release --filter $filter `
              --logger "trx;LogFileName=$($project.LogName)" `
              --results-directory .\bin\logs\tests\fast-managed
            $project.ExitCode = $LASTEXITCODE
            Write-Host ("{0} restore/build/test: {1:N2} seconds; exit code {2}." -f
              $project.Label, ((Get-Date) - $started).TotalSeconds, $project.ExitCode)
          }
          $failedRows = @()
          foreach ($project in $projects) {
            $trxPath = Join-Path '.\bin\logs\tests\fast-managed' $project.LogName
            if (!(Test-Path -LiteralPath $trxPath -PathType Leaf)) {
              throw "$($project.Label) tests produced no TRX (dotnet exit code $($project.ExitCode))."
            }
            [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
            $ns = [System.Xml.XmlNamespaceManager]::new($trx.NameTable)
            $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            $results = @($trx.SelectNodes('/t:TestRun/t:Results/t:UnitTestResult', $ns))
            if ($results.Count -eq 0) {
              throw "The $($project.Label) filter selected zero test rows."
            }
            $definitions = @{}
            foreach ($definition in $trx.SelectNodes('/t:TestRun/t:TestDefinitions/t:UnitTest', $ns)) {
              $definitions[$definition.GetAttribute('id')] = $definition
            }
            $qualifiedNames = @(
              foreach ($result in $results) {
                $definition = $definitions[$result.GetAttribute('testId')]
                if ($null -eq $definition) {
                  throw "Test definition is missing for '$($result.GetAttribute('testName'))'."
                }
                $method = $definition.SelectSingleNode('t:TestMethod', $ns)
                if ($null -eq $method) {
                  throw "Test method is missing for '$($result.GetAttribute('testName'))'."
                }
                ($method.GetAttribute('className') -split ',')[0] + '.' + $method.GetAttribute('name')
              }
            )
            foreach ($selector in $project.Selection.Keys) {
              $name = $selector.Substring('FullyQualifiedName~'.Length)
              $count = @($qualifiedNames | Where-Object { $_.Contains($name) }).Count
              if ($count -lt $project.Selection[$selector]) {
                throw "Incomplete $($project.Label) selection: '$name' has $count rows; expected at least $($project.Selection[$selector])."
              }
            }
            foreach ($name in $project.RequiredRows) {
              if (@($results | Where-Object { $_.GetAttribute('testName') -ceq $name }).Count -ne 1) {
                throw "Expected exactly one $($project.Label) row '$name'."
              }
            }
            Write-Host "Verified $($results.Count) selected $($project.Label) rows in $($project.LogName)."
            $failedRows += @($results | Where-Object { $_.GetAttribute('outcome') -cne 'Passed' })
          }
          $failedProjects = @($projects | Where-Object { $_.ExitCode -ne 0 })
          if ($failedProjects.Count -ne 0) { exit $failedProjects[0].ExitCode }
          if ($failedRows.Count -ne 0) {
            throw 'Every selected managed test row must pass; skipped or unexecuted rows do not qualify.'
          }

      - name: Upload fast managed test results
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: fast_managed_tests
          path: bin/logs/tests/fast-managed/*.trx
          retention-days: 7

  native-producer-regressions:
    name: Fast native producer regressions
    needs: [changes]
    if: needs.changes.outputs.build_needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Run native declaration producer regressions
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $started = Get-Date
          dotnet test .\tests\Win32MetadataScraperTests -c Release `
            --filter "FullyQualifiedName~Win32MetadataScraperTests.NativeDeclarationTransportTests" `
            --logger "trx;LogFileName=FastNativeProducer.trx" `
            --results-directory .\bin\logs\tests\fast-native-producer
          $testExitCode = $LASTEXITCODE
          Write-Host ("Native producer restore/build/test: {0:N2} seconds; exit code {1}." -f
            ((Get-Date) - $started).TotalSeconds, $testExitCode)

          $trxPath = '.\bin\logs\tests\fast-native-producer\FastNativeProducer.trx'
          if (!(Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw "Native producer tests produced no TRX (dotnet exit code $testExitCode)."
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $ns = [System.Xml.XmlNamespaceManager]::new($trx.NameTable)
          $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
          $results = @($trx.SelectNodes('/t:TestRun/t:Results/t:UnitTestResult', $ns))
          if ($results.Count -ne 4) {
            throw "Incomplete native producer selection: $($results.Count) rows; expected exactly four."
          }
          $definitions = @{}
          foreach ($definition in $trx.SelectNodes('/t:TestRun/t:TestDefinitions/t:UnitTest', $ns)) {
            $definitions[$definition.GetAttribute('id')] = $definition
          }
          $rows = @(
            foreach ($result in $results) {
              $definition = $definitions[$result.GetAttribute('testId')]
              if ($null -eq $definition) {
                throw "Native producer definition is missing for '$($result.GetAttribute('testName'))'."
              }
              $method = $definition.SelectSingleNode('t:TestMethod', $ns)
              if ($null -eq $method) {
                throw "Native producer method is missing for '$($result.GetAttribute('testName'))'."
              }
              @{
                Name = $result.GetAttribute('testName')
                QualifiedName = ($method.GetAttribute('className') -split ',')[0] + '.' +
                  ($method.GetAttribute('name') -split '\(', 2)[0]
              }
            }
          )
          $class = 'Win32MetadataScraperTests.NativeDeclarationTransportTests'
          $logicalRows = @($rows | Where-Object {
            $_.QualifiedName -ceq "$class.LogicalGroupProducerTransportsTheActualNativeDeclaration"
          })
          $forwardRows = @($rows | Where-Object {
            $_.QualifiedName -ceq "$class.IncompleteRecordProducerTransportsDeclarationIdentityWithoutLayout"
          })
          if ($logicalRows.Count -ne 3 -or $forwardRows.Count -ne 1) {
            throw 'Native producer results must contain three logical-group rows and one forward-record row.'
          }
          $targets = [ordered]@{
            x86 = 'i686-pc-windows-msvc'
            x64 = 'x86_64-pc-windows-msvc'
            arm64 = 'aarch64-pc-windows-msvc'
          }
          foreach ($architecture in $targets.Keys) {
            $token = '(?<![A-Za-z0-9_])' + [regex]::Escape($architecture) + '(?![A-Za-z0-9_])'
            $matching = @($logicalRows | Where-Object {
              $_.Name -cmatch $token -and $_.Name.Contains($targets[$architecture])
            })
            if ($matching.Count -ne 1) {
              throw "Expected exactly one native logical-group producer row for $architecture/$($targets[$architecture])."
            }
          }
          Write-Host 'Verified all three native logical-group architecture rows and the forward-record row.'
          if ($testExitCode -ne 0) { exit $testExitCode }
          if (@($results | Where-Object { $_.GetAttribute('outcome') -cne 'Passed' }).Count -ne 0) {
            throw 'Every native producer row must pass; skipped or unexecuted rows do not qualify.'
          }

      - name: Upload native producer test results
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: fast_native_producer_tests
          path: bin/logs/tests/fast-native-producer/FastNativeProducer.trx
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Stage 1: Parallel header scraping (one job per architecture)
  # ──────────────────────────────────────────────────────────────────────

  scrape:
    name: 'Scrape headers: ${{ matrix.arch }}'
    needs: [changes]
    if: needs.changes.outputs.build_needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            extra_args: ''
            set_version: true
          - arch: x86
            extra_args: '-scrapeConstants'
            set_version: false
          - arch: arm64
            extra_args: ''
            set_version: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install nbgv and set version
        if: matrix.set_version
        shell: pwsh
        run: |
          .\scripts\Install-DotNetTool.ps1 -Name nbgv -NuGetConfigFile "${{ github.workspace }}\nuget.config"
          nbgv cloud

      - name: Generate metadata source (${{ matrix.arch }})
        shell: pwsh
        run: .\scripts\GenerateMetadataSource.ps1 -arch ${{ matrix.arch }} ${{ matrix.extra_args }}

      - name: Upload generated assets
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: generated_${{ matrix.arch }}
          path: generation/WinSDK/obj
          retention-days: 1

      - name: Upload build logs
        uses: ./.github/actions/upload-artifact-with-retry
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: scrape_logs_${{ matrix.arch }}
          path: bin/logs
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2: Build, test, and package (depends on all scrape jobs)
  # ──────────────────────────────────────────────────────────────────────

  build-test:
    name: 'Build, test, package'
    needs: [changes, scrape]
    if: always() && needs.changes.result == 'success'
    runs-on: windows-2022
    # Temporary diagnostic allowance while reducing managed pipeline execution time.
    timeout-minutes: 180

    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.build_needed != 'true'
        shell: pwsh
        run: Write-Host 'All changed files are under docs/ or apidocs/. No build is required.'

      - name: Verify scrape jobs
        if: needs.changes.outputs.build_needed == 'true' && needs.scrape.result != 'success'
        shell: pwsh
        run: throw 'One or more header scrape jobs did not succeed.'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        if: needs.changes.outputs.build_needed == 'true'
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: needs.changes.outputs.build_needed == 'true'
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        if: needs.changes.outputs.build_needed == 'true'

      - name: Download all generated assets
        if: needs.changes.outputs.build_needed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: generated_*
          path: generation/WinSDK/obj
          merge-multiple: true

      - name: Build metadata binary
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\BuildMetadataBin.ps1 -assetsScrapedSeparately

      - name: Package
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\DoPackages.ps1

      - name: Build samples
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\DoSamples.ps1

      - name: Run tests
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\DoTests.ps1

      - name: Download baseline winmd from target branch
        if: needs.changes.outputs.build_needed == 'true' && github.event_name == 'pull_request'
        id: baseline
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest successful run on the target branch
            const baseBranch = context.payload.pull_request.base.ref;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-validation.yml',
              branch: baseBranch,
              status: 'success',
              per_page: 1
            });

            if (runs.data.workflow_runs.length === 0) {
              core.warning(`No successful runs found on ${baseBranch}. Will fall back to NuGet baseline.`);
              return;
            }

            const runId = runs.data.workflow_runs[0].id;
            core.info(`Found baseline run ${runId} on ${baseBranch}`);

            // Find the winmd artifact
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const winmdArtifact = artifacts.data.artifacts.find(a => a.name === 'winmd');
            if (!winmdArtifact) {
              core.warning('No winmd artifact found in baseline run. Will fall back to NuGet baseline.');
              return;
            }

            if (winmdArtifact.expired) {
              core.warning('The baseline winmd artifact has expired. Will fall back to NuGet baseline.');
              return;
            }

            // Download and extract
            try {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: winmdArtifact.id,
                archive_format: 'zip'
              });

              const outputDir = 'bin/baseline-artifact';
              fs.mkdirSync(outputDir, { recursive: true });
              const zipPath = path.join(outputDir, 'artifact.zip');
              fs.writeFileSync(zipPath, Buffer.from(download.data));

              // Extract using PowerShell
              const { execSync } = require('child_process');
              execSync(`Expand-Archive -Path "${zipPath}" -DestinationPath "${outputDir}" -Force`, { shell: 'pwsh' });
              fs.unlinkSync(zipPath);
              core.info(`Extracted baseline winmd to ${outputDir}`);
            } catch (error) {
              core.warning(`Could not download or extract the baseline winmd artifact. Will fall back to NuGet baseline: ${error.message}`);
            }

      - name: Generate API surface diff
        if: needs.changes.outputs.build_needed == 'true' && github.event_name == 'pull_request'
        id: apidump
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $winmdUtils = "bin\Release\net10.0\WinmdUtils.dll"
          $currentWinmd = "bin\Windows.Win32.winmd"

          # Determine baseline: prefer main branch artifact, fall back to last release
          $baselineWinmd = "bin\baseline-artifact\Windows.Win32.winmd"
          if (-not (Test-Path $baselineWinmd)) {
            Write-Host "No main branch artifact found, falling back to last NuGet release..."
            . .\scripts\CommonUtils.ps1
            $baselineWinmd = Get-Win32MetadataLastReleaseWinmdPath
          }

          Write-Host "Baseline: $baselineWinmd"
          Write-Host "Current:  $currentWinmd"

          # Dump baseline
          Write-Host "Dumping baseline..."
          & dotnet $winmdUtils dump --winmd $baselineWinmd --output bin\baseline.apidump.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to dump baseline" }

          # Dump current build
          Write-Host "Dumping current build..."
          & dotnet $winmdUtils dump --winmd $currentWinmd --output bin\current.apidump.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to dump current" }

          # Generate diff — git diff exits 1 when differences exist, which is expected
          & cmd /c "git diff --no-index --unified=3 bin\baseline.apidump.cs bin\current.apidump.cs > bin\api-diff.patch 2>&1"
          $diffExitCode = $LASTEXITCODE

          if ($diffExitCode -eq 0) {
            Write-Host "No API differences found."
            "has_diff=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "API differences detected."
            "has_diff=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            # Count additions/deletions from the patch file
            $diffLines = Get-Content bin\api-diff.patch
            $additions = ($diffLines | Where-Object { $_ -match '^\+[^+]' }).Count
            $deletions = ($diffLines | Where-Object { $_ -match '^\-[^-]' }).Count
            "additions=$additions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "deletions=$deletions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            Write-Host "+$additions additions / -$deletions deletions"
          }

          # Reset LASTEXITCODE so GitHub Actions doesn't treat this step as failed
          $global:LASTEXITCODE = 0

      - name: Upload API diff
        if: needs.changes.outputs.build_needed == 'true' && github.event_name == 'pull_request'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: api-diff
          path: bin/api-diff.patch
          retention-days: 7

      - name: Upload winmd and API dump
        uses: ./.github/actions/upload-artifact-with-retry
        if: always() && needs.changes.outputs.build_needed == 'true' && steps.checkout.outcome == 'success'
        with:
          name: winmd
          path: |
            bin/Windows.Win32.winmd
            bin/current.apidump.cs
            bin/baseline.apidump.cs
            bin/api-diff.patch
          retention-days: 90

      - name: Upload build logs
        uses: ./.github/actions/upload-artifact-with-retry
        if: always() && needs.changes.outputs.build_needed == 'true' && steps.checkout.outcome == 'success'
        with:
          name: build_logs
          path: bin/logs
          retention-days: 7

      - name: Upload NuGet packages
        if: needs.changes.outputs.build_needed == 'true'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: NuGetPackages
          path: bin/Packages/Release/NuGet
          retention-days: 7

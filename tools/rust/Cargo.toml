windows-metadata = { git = "https://github.com/jevansaks/windows-rs", rev = "0a4d025f87a301eecf0eb9dce8bce8ae9e811eb9" }
windows-rdl = { git = "https://github.com/jevansaks/windows-rs", rev = "0a4d025f87a301eecf0eb9dce8bce8ae9e811eb9" }
